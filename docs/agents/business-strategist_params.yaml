# Team parameters for baselines/business_case.py (Task D). Written by the business-strategist agent, 2026-11-06.
# EVERY value is an [assumption] chosen and justified in docs/agents/business-strategist.md (sections 3-5).
# Not a Europress price, cost structure or validated willingness to pay. All dataset prices are hypothetical.
# Run:  python baselines/business_case.py competition --params business-strategist_params.yaml --out my_business_case
#       (needs `pip install tabulate` for the markdown report; the CSV outputs do not)
# Scenario switch: change value_realisation to the LOW or HIGH block below; prices list already spans 10/15/25.
status: "TEAM PARAMETERS - base case, assumptions justified in docs/agents/business-strategist.md"
pricing:
  price_per_device_month_eur: [10, 15, 25]      # low / base / high Verified Weight add-on (section 3, M1)
  price_per_site_month_eur: null
  share_of_verified_savings_pct: 20             # outcome alternative (M3); base 20 %
costs:
  onboarding_per_customer_eur: 600              # ~7.5 h contract+invoice intake at EUR 80/h
  onboarding_per_device_eur: 40
  operating_cost_per_device_month_eur: 2.5      # cloud, model upkeep, SMART Center share
  customer_support_per_customer_month_eur: 20   # ~15 min/month at EUR 80/h
adoption:
  adoption_share_of_eligible_pct: [8, 20, 35]   # cumulative end of year 1 / 2 / 3, base case
  purchase_condition_value_multiple: 3          # customer buys only if realisable value >= 3 x annual fee
value_realisation:                              # BASE. LOW = .30/.05/.10/.10/.10/.05 ; HIGH = .70/.25/.40/.40/.40/.30
  billing_review: 0.50                          # document-backed (contract vs invoice, device mass as evidence)
  over_servicing: 0.10                          # SMART already optimises fill, so little incremental value
  contamination: 0.25
  contract_review: 0.25
  operator_performance: 0.25
  operator_tendering: 0.15
future_models:                                  # hypotheses; all OFF in the base case (see model ranking, M6-M8)
  transport_procurement:
    enabled: false
    discount_on_logistics_pct: null
    realisation: null
  tonne_based_full_service:
    enabled: false
    margin_on_customer_spend_pct: null          # if enabled: 1.5 / 3 / 5 % (M8)
  materials_marketplace:
    enabled: false
    credit_uplift_eur_per_t: null               # if enabled: 2 / 4 / 6 EUR/t at realisation 0.3 (M7)
    realisation: null
