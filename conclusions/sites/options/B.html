const PINS = [

// ---- filters ----
const opt = (el, first, list) => { el.innerHTML = `<option value="">${first}</option>` + list.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join(""); };

["#q", "#fOp", "#fCause", "#fStatus", "#fTare"].forEach(s => $(s).addEventListener("input", () => { limit = 100; render(); }));
$("#reset").onclick = () => { ["#q", "#fOp", "#fCause", "#fStatus", "#fTare"].forEach(s => $(s).value = ""); setView("all"); };
function setView(v) { view = v; limit = 100; render(); }
function filtered() {

const COLS = [

const sorted = () => filtered().sort((a, b) => { const x = val(a, sortK), y = val(b, sortK); return (x > y ? 1 : x < y ? -1 : 0) * sortD; });

const events = [];
