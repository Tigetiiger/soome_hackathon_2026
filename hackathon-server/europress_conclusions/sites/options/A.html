<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART · Verified Weight — Option A: Conclusions feed (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#000d61;--mint:#54dea9;--ice:#e0f1f5;--ink:#14183a;--mut:#5b6180;--line:#d5dde6;--bg:#f5f8fa;--warn:#b5651d;--dev:#3d6fb6;--tk:#6b7a8f;--inv:#8a5fbf}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Open Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,.arch{font-family:Archivo,system-ui,sans-serif;margin:0}
a{color:var(--navy)}
.syn{background:#fff3c4;color:#5a4300;text-align:center;font-size:12.5px;padding:5px 10px;font-weight:600;border-bottom:1px solid #e6d58a}
.app{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 28px)}
nav.side{background:var(--navy);color:#cfd6ff;padding:16px 0}
nav.side .logo{font:800 18px Archivo;color:#fff;padding:0 18px 14px;letter-spacing:.5px}
nav.side .logo span{color:var(--mint)}
nav.side a{display:block;color:#cfd6ff;text-decoration:none;padding:8px 18px;font-size:14px}
nav.side a.on{background:rgba(84,222,169,.16);color:#fff;border-left:3px solid var(--mint);padding-left:15px;font-weight:600}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8790c8;padding:14px 18px 4px}
main{padding:22px 28px 60px;max-width:1080px;width:100%}
.crumb{font-size:13px;color:var(--mut);margin-bottom:6px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:26px;color:var(--navy)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;text-decoration:none;font-size:13px;color:var(--ink)}
.tabs a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 18px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sum b{display:block;font:700 20px Archivo;color:var(--navy)}
.sum small{color:var(--mut);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{font:600 13px "Open Sans";padding:5px 11px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--ice);border-color:#9fcfdb;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start}
.rank{font:800 18px Archivo;color:var(--navy);background:var(--ice);border-radius:8px;text-align:center;padding:4px 0}
.card h3{font-size:16.5px;color:var(--navy);line-height:1.3}
.meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.num{font:700 15px Archivo}
.band{color:var(--mut);font-size:12.5px}
.eur{text-align:right;min-width:150px}
.eur .v{font:800 20px Archivo;color:var(--navy)}
.tag{display:inline-block;font:700 10.5px "Open Sans";letter-spacing:.6px;padding:2px 6px;border-radius:4px;vertical-align:middle;margin-right:4px}
.OBSERVED{background:#dff3e8;color:#155a37}.ESTIMATED{background:#e3ecfb;color:#1c3f7a}.SIMULATED{background:#efe4fa;color:#55288a}.HYPOTHETICAL{background:#fff0d6;color:#7a4b00}
.conf{font-size:12px;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:700 13.5px Archivo;padding:8px 14px;border-radius:6px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;text-decoration:none;display:inline-block}
.btn.cta{background:var(--mint);border-color:var(--mint);color:var(--navy)}
.btn.ghost{border-color:var(--line);color:var(--mut)}
details.math{margin-top:8px;font-size:13.5px}
details.math summary{cursor:pointer;color:var(--navy);font-weight:600}
details.math ol{margin:6px 0 0;padding-left:20px}
.dismissed{opacity:.85;border-style:dashed}
.sec{font:700 13px Archivo;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:20px 0 8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.panel h2{font-size:17px;color:var(--navy);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}
.bars .row{display:grid;grid-template-columns:90px 1fr 80px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.bars .trk{position:relative;height:18px;background:var(--bg);border-radius:4px}
.bars .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bars .err{position:absolute;top:-3px;bottom:-3px;border:2px solid rgba(0,13,97,.45);border-top:0;border-bottom:0}
.wrong{background:#fff8ec;border:1px solid #f0d9ae;border-radius:8px;padding:10px 12px;font-size:13.5px}
.log{font:12px ui-monospace,Menlo,monospace;background:#0b1240;color:#c9f5e3;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;margin-top:10px}
.drawer{border-top:3px solid var(--mint)}
.ok{background:#dff3e8;color:#155a37;padding:8px 10px;border-radius:6px;font-weight:600;font-size:13.5px}
svg text{font:11px "Open Sans";fill:var(--mut)}
@media (max-width:760px){.app{grid-template-columns:1fr}nav.side{display:flex;overflow-x:auto;padding:6px 0;white-space:nowrap}nav.side .grp{display:none}nav.side .logo{padding:8px 12px;font-size:15px}nav.side a{padding:8px 10px;font-size:13px}nav.side a.on{border-left:0;border-bottom:3px solid var(--mint);padding-left:10px}
main{padding:14px 12px 50px}.sum{grid-template-columns:1fr 1fr}.card{grid-template-columns:28px 1fr}.eur{grid-column:2;text-align:left;min-width:0}.grid2{grid-template-columns:1fr}.top h1{font-size:21px}.bars .row{grid-template-columns:62px 1fr 64px}}
