# Results website: serves /data/site (written by the pipeline's "site" step).
# The Route gives a public HTTPS URL; delete it and use "oc port-forward" to keep it private.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compactor-site
  labels:
    app.kubernetes.io/name: compactor-site
    app.kubernetes.io/part-of: compactor-sim
spec:
  replicas: 1
  strategy:
    type: Recreate   # the data volume is ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: compactor-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compactor-site
        app.kubernetes.io/part-of: compactor-sim
    spec:
      containers:
        - name: web
          image: compactor-sim:latest
          command:
            - bash
            - -c
            - mkdir -p /data/site && exec python -m http.server 8080 --bind 0.0.0.0 --directory /data/site
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: compactor-data
---
apiVersion: v1
kind: Service
metadata:
  name: compactor-site
  labels:
    app.kubernetes.io/name: compactor-site
    app.kubernetes.io/part-of: compactor-sim
spec:
  selector:
    app.kubernetes.io/name: compactor-site
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: compactor-site
  labels:
    app.kubernetes.io/name: compactor-site
    app.kubernetes.io/part-of: compactor-sim
spec:
  to:
    kind: Service
    name: compactor-site
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
